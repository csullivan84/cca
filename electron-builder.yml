appId: com.csullivan84.cca
productName: Colour Contrast Analyser
compression: maximum
directories:
  output: dist
files:
  - "**/*"
releaseInfo:
  releaseNotesFile: CHANGELOG.md
extraResources:
  - "resources/**"
  - "icons/**"

mac:
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: "build/entitlements.mac.plist"
  entitlementsInherit: "build/entitlements.mac.plist"
  category: public.app-category.developer-tools
  artifactName: "${name}-${version}.${ext}"
  icon: "build/icon.icns"
  type: distribution
  notarize: false


dmg:
  sign: false

win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  artifactName: "${name}-Setup-${env.ARCH}-${version}.${ext}"
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  uninstallDisplayName: "Uninstall Colour Contrast Analyser (CCA)"
  createDesktopShortcut: true

msi:
  artifactName: "${name}-Setup-${version}.${ext}"
  oneClick: false
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: "${name}-Portable-${env.ARCH}-${version}.${ext}"

linux:
  icon: "build/icon.png"
  category: "Utility"
  desktop:
    StartupNotify: "false"
    Encoding: "UTF-8"
    MimeType: "x-scheme-handler/deeplink"
  target: ["AppImage", "rpm", "deb"]
  artifactName: "${productName}-Setup-${version}.${ext}"

deb:
  priority: "optional"
  #afterInstall:"installer/linux/after-install.tpl",

#rpm:
  #fpm: ["--before-install", "installer/linux/before-install.tpl"],
  #afterInstall:"installer/linux/after-install.tpl",

publish: null
