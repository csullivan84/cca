appId: com.csullivan84.cca
productName: CCA
asar: true
compression: normal
directories:
  output: dist
files:
  - src/main.js
  - src/preload.cjs
  - src/core/**
  - src/ui/index.html
  - src/ui/style.css
  - src/ui/app.bundle.js
  - src/views/translations/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
mac:
  target:
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
win:
  icon: build/icon.ico
  target:
    - target: zip
      arch: [x64]
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: cca-setup-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Utility
  target: [AppImage, deb]
artifactName: cca-${version}-${os}-${arch}.${ext}
publish: null
